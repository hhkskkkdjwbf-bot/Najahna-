name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all automated tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          npm run check
          node --check src/data/curriculum.js
          node --check src/data/resources.js
          node --check src/data/official-sources.js
          node --check src/utils/quiz-history.js
          node --check service-worker.js
          node --check src/data/resource-filters.js
          node --check src/calculators/average.js
      - name: Check required project files
        run: |
          test -s index.html
          test -s assets/css/main.css
          test -s assets/js/app.js
          test -s src/data/curriculum.js
          test -s README.md
