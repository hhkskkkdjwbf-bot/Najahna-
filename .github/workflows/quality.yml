name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all automated tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          npm run check
          node --check src/data/curriculum.js
          node --check src/data/resources.js
          node --check src/data/official-sources.js
          node --check src/data/school-calendar.js
          node --check src/i18n/ar.js
          node --check src/i18n/fr.js
          node --check src/i18n/en.js
          node --check scripts/audit-official-sources.js
          node --check src/utils/account-profile.js
          node --check src/utils/cloud-account.js
          node --check src/utils/cloud-backup-validation.js
          node --check src/config/supabase.js
          node --check src/utils/quiz-history.js
          node --check service-worker.js
          node --check src/data/resource-filters.js
          node --check src/calculators/average.js
      - name: Check required project files
        run: |
          test -s index.html
          test -s assets/css/main.css
          test -s assets/js/app.js
          test -s src/utils/account-profile.js
          test -s src/utils/cloud-account.js
          test -s src/config/supabase.js
          test -s supabase/migrations/202610240001_secure_learner_accounts.sql
          test -s src/data/curriculum.js
          test -s README.md
          test -s robots.txt
          test -s sitemap.xml
          grep -q 'rel="canonical"' index.html
          grep -q 'property="og:title"' index.html
          grep -q 'https://hhkskkkdjwbf.github.io/Najahna-/sitemap.xml' robots.txt
          grep -q '<urlset' sitemap.xml
