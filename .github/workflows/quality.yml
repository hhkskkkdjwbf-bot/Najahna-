name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator tests
        run: node --test tests/average.test.js
      - name: Check required project files
        run: |
          test -s index.html
          test -s assets/css/main.css
          test -s assets/js/app.js
          test -s README.md
